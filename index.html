<!doctype html>
<html lang="en-GB">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>MR Tanker Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height console \2014  3D stage left, instrument panel right; stacks on phones. Single dark "cargo control room" look by choice. */
:root{
  --bg:#0c1117; --stage:#0f161e; --panel:#131b24; --raise:#1a2430; --line:#26323f;
  --fg:#e5eaef; --muted:#8996a4; --accent:#f0a02a; --ok:#3fbf86; --stop:#e5574d; --warn:#f2c94c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--muted);margin-top:4px;text-transform:none}
.crumbs{display:flex;gap:6px;align-items:center;font:500 13px var(--f-mono);color:var(--muted);flex-wrap:wrap;min-width:0}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chip{margin-left:auto;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);padding:4px 8px;border-radius:3px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
#stage{position:relative;background:var(--stage);min-height:0;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.console{position:absolute;inset:auto 12px 12px auto;z-index:7;width:min(560px,calc(100% - 24px));background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--accent);border-radius:6px;padding:10px 12px;font:13px var(--f-body);color:var(--fg)}
.console h4{margin:0 0 6px;font:600 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.console canvas{width:100%;height:auto;display:block;border-radius:4px;background:#000}
.console .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.console button{font:500 12px var(--f-body);padding:5px 9px;border:1px solid var(--line,#456);background:transparent;color:var(--fg);border-radius:4px;cursor:pointer}
.console button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.console .x{position:absolute;right:8px;top:6px}
.console p{margin:6px 0 0;color:var(--muted,#9ab)}

.hs{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:4px 8px 4px 6px;border-radius:3px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);font:500 12px var(--f-body);cursor:pointer;white-space:nowrap}
.hs i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.hs.ready{border-color:var(--accent)} .hs.ready i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tour{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--accent);border-radius:6px;padding:12px 14px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tour h3{margin:0 0 4px;font:600 15px var(--f-body);color:var(--fg)} .tour p{margin:0 0 10px;font:400 13px/1.5 var(--f-body);color:var(--fg)}
.tour .tbar{display:flex;gap:6px;align-items:center} .tour .tbar span{margin-right:auto;font:500 11px var(--f-mono);color:var(--muted)}
.tour .tbar button{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font:500 12px var(--f-body);color:var(--fg);cursor:pointer}
.tour .prog{height:3px;background:var(--line);border-radius:2px;margin:0 0 8px;overflow:hidden} .tour .prog i{display:block;height:100%;width:0;background:var(--accent)}
.hs:hover{background:var(--raise)}
.hs.area{padding:2px 7px;border-color:transparent;background:color-mix(in srgb,#0b1118 62%,transparent);color:#e8eef3;font:600 11px var(--f-body);letter-spacing:.02em}
.hs.area i{display:none}
#stage[data-lbl="off"] .hs,#stage[data-lbl="mods"] .hs.area,#stage[data-lbl="areas"] .hs:not(.area){display:none!important}
.stage-note{position:absolute;left:12px;top:10px;font:400 11px var(--f-mono);color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}
.navdock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--panel) 92%,transparent);max-width:calc(100% - 24px);z-index:3;touch-action:none}
.navdock .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 3px}
.nb{width:36px;height:36px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:4px;color:var(--fg);cursor:pointer;padding:0;touch-action:none;-webkit-user-select:none;user-select:none}
.nb:hover{background:var(--raise)} .nb:active{background:var(--line)}
.nb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navpop{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:max-content;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 24px)}
.navpop .grid{display:grid;grid-template-columns:repeat(3,auto);gap:6px}
.navpop .grid button{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:7px 12px;font:500 12px var(--f-body);cursor:pointer;color:var(--fg)}
.navpop .grid button:hover{border-color:var(--accent)}
.navpop table{border-collapse:collapse;font:400 12px var(--f-body)} .navpop td{padding:3px 10px 3px 0;vertical-align:top} .navpop td:first-child{color:var(--accent);font-family:var(--f-mono);white-space:nowrap}
.navpop h4{margin:0 0 6px;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stage-note{top:10px}
@media (max-width:700px){.nb{width:34px;height:34px}.stage-note{display:none}}
.card h4{margin:12px 0 4px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .ct{font:600 18px/1.15 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
.card ul{margin:0;padding-left:18px} .card li{margin:2px 0}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.card .acts button{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:500 12px var(--f-body);color:var(--fg);cursor:pointer}
.card .acts button.pri{border-color:var(--accent);color:var(--accent)}
.rules details{border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:4px 0;background:var(--raise)}
.rules summary{cursor:pointer;font:600 12px var(--f-mono);color:var(--accent)} .rules p{margin:6px 0 0}
.stpill{display:inline-block;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--warn);color:var(--warn)}
.stpill.approved{border-color:var(--ok);color:var(--ok)}
.psearch{width:100%;box-sizing:border-box;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--fg);font:400 13px var(--f-body)}
.sres{list-style:none;margin:6px 0 0;padding:0;max-height:240px;overflow:auto} .sres button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 4px;color:var(--fg);cursor:pointer;font:400 13px var(--f-body)} .sres button:hover{background:var(--raise)} .sres small{display:block;color:var(--muted);font:400 11px var(--f-mono)}
.quiz .opt{display:block;width:100%;text-align:left;margin:4px 0;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:7px 9px;color:var(--fg);cursor:pointer;font:400 13px var(--f-body)}
.quiz .opt.ok{border-color:var(--ok)} .quiz .opt.bad{border-color:var(--stop)} .quiz .fb{margin:6px 0;font-size:13px}
.stage-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tbtn{background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:3px;font:500 12px var(--f-body);cursor:pointer;text-align:left}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.caption{position:absolute;left:12px;top:12px;max-width:min(520px,calc(100% - 170px));background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font:500 13px var(--f-body)}
.caption b{display:block;font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:500 13px var(--f-mono);color:var(--muted);background:var(--stage)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
h2{font:600 20px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;font:600 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:7px 8px;cursor:pointer}
.steps button .n{font:500 12px var(--f-mono);color:var(--muted);padding-top:1px}
.steps button[aria-current="step"]{background:var(--raise);border-color:var(--line)}
.steps button[aria-current="step"] .n{color:var(--accent)}
.cap{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px}
.cap b{font:600 16px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.cap ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.transport{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.transport button{background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;font:500 13px var(--f-body)}
.transport button.primary{background:var(--accent);color:#1b1205;border-color:var(--accent);font-weight:600;min-width:72px}
.bar{flex:1;min-width:60px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g{border:1px solid var(--line);border-radius:3px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.g span{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.g strong{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g.alarm{border-color:var(--stop)} .g.alarm strong{color:var(--stop)}
.g.warn{border-color:var(--warn)} .g.warn strong{color:var(--warn)}
.g strong span{font:inherit;letter-spacing:0;text-transform:none}
.st-open,.g strong .st-open{color:var(--ok)} .st-shut,.g strong .st-shut{color:var(--stop)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font:400 12px var(--f-body);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:16px;height:6px;border-radius:3px;display:inline-block}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.layers label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;padding:6px 8px;cursor:pointer;font-size:13px}
.layers i{width:10px;height:10px;border-radius:2px;flex:none}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mods button{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:none;border:1px solid var(--line);border-radius:3px;padding:8px 10px;cursor:pointer}
.mods button:hover{background:var(--raise)}
.pill{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ready{border-color:var(--accent);color:var(--accent)}
.parts{display:flex;flex-direction:column;gap:2px}
.parts button{text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:5px 8px;cursor:pointer;font-size:13px}
.parts button[aria-pressed="true"]{background:var(--raise);border-color:var(--accent)}
.info{border-left:2px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.info b{font:600 15px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--accent)}
.sme{margin:0;padding-left:18px} .sme li{margin-bottom:6px}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:58vh auto;overflow-y:auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .app{height:auto;min-height:100%}
  .chip{margin-left:0}
  .caption{max-width:calc(100% - 24px);top:auto;bottom:34px}
}
</style>

<div class="app">
<header>
  <div class="brand">MR Tanker Walkthrough<small>ISF Group &#xb7; 3D technical training &#xb7; <span id="ver">v1.1</span></small></div>
  <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
  <span class="chip">Draft &#xb7; pending SME sign-off</span>
</header>
<main>
  <div id="stage">
    <div id="loading">Loading 3D model&#x2026;</div>
    <div class="caption" id="caption" hidden></div>
    <div class="tour" id="tour" hidden role="region" aria-label="Ship tour"></div>
    <div class="stage-tools" id="tools"></div>
    <div class="stage-note" id="snote"></div>
    <div class="navdock" id="navdock" role="toolbar" aria-label="3D view controls"></div>
    <div class="navpop" id="navpop" hidden></div>
  </div>
  <aside id="panel"></aside>
</main>
</div>

    if(!hit) return; const m=o.material; if(on){ m.transparent=true; m.opacity=op; m.depthWrite=false; } else { m.transparent=m.userData.tr0; m.opacity=m.userData.op0; m.depthWrite=!m.userData.tr0; } m.needsUpdate=true; });
}
function applyValves(mod,state){
  for(const v of mod.prep.valves){ const s=clamp(state[v.key]??0,0,1);
    if(v.lift){ v.o.position.copy(v.p0).add(new THREE.Vector3(0,v.lift*s,0)); continue; }
    const neg=v.axis.endsWith('-'); const ax=AX[v.axis[0]].clone().multiplyScalar(neg?-1:1);
    v.o.quaternion.copy(v.q0).multiply(new THREE.Quaternion().setFromAxisAngle(ax,THREE.MathUtils.degToRad(v.open*s))); }
}

  if(th>=MEK.EVC&&th<MEK.SOI) return pcomp(th);
  if(th>=MEK.SOI) return pcomp(th)+(p8-pcomp(0))*0.15*(th-MEK.SOI)/3;
  if(th<8) return pcomp(th)+(p8-pcomp(th))*(0.15+0.85*th/8);
  if(th<MEK.EVO) return p8*Math.pow(V8/meVol(th),1.3);

 steps:[{c:'The boat crew (at least 3) put on immersion suits or anti-exposure suits and lifejackets and board the boat in its cradle. The painter is rigged from well forward to the boat\u2019s bow.',d:7,rule:'SOLAS III Reg 17; LSA Code 5.1',cam:[[8,-30,30],[16.5,-14,23]],clip:[0,2]},
        {c:'The davit takes the weight, lifts the boat out of the cradle and slews it outboard, clear of the ship\u2019s side. The boat hangs fore-and-aft from the single-point hook.',d:7,rule:'LSA Code 6.1.1',cam:[[34,-52,24],[19,-16,18]],clip:[2,9]},
        {c:'The boat is lowered at about 0.8 m/s (real time); everyone keeps clear of the fall. The painter keeps the boat heading with the ship.',d:15,rule:'LSA Code 6.1.2.8 (minimum lowering speed 0.4 + 0.02H m/s)',cam:[[34,-52,24],[19,-16,18]],clip:[9,24]},
        {c:'Once waterborne the fall is released and the painter slipped; the boat motors clear to marshal the liferafts or pick up a person in the water.',d:7,rule:'LSA Code 5.1.4 (release gear)',cam:[[40,-58,24],[22,-18,15]],clip:[24,31]},
        {c:'Recovery: the boat returns under the davit and the fall is hooked on to the lifting hook.',d:7,rule:'SOLAS III Reg 17',cam:[[34,-52,24],[19,-16,18]],clip:[31,38]},
        {c:'The boat is hoisted with its full complement (shown faster than real time; minimum 0.3 m/s at full load).',d:10,rule:'LSA Code 6.1.2.11 (recovery with full complement)',cam:[[34,-52,24],[19,-16,18]],clip:[38,48]},
        {c:'The davit slews inboard and the boat is landed and secured in its cradle; the fall and hook are made ready.',d:8,rule:'LSA Code 6.1.1',cam:[[8,-30,30],[16.5,-14,23]],clip:[48,56]},
        {c:'Rescue boats are launched with their crew and manoeuvred in the water each month where practicable, and at least every 3 months.',d:6,rule:'SOLAS III Reg 19.3.3',cam:[[8,-30,30],[16.5,-14,23]],clip:[56,56]}],
 start(s){ keepPose(s,['LSA_RescueBoat','LSA_RescueDavitArm','LSA_RescueFall','LSA_RescuePainter']); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip; clipAt(s,'ANIM_rescue',c[0]+(c[1]-c[0])*k); }};
// ---- liferaft: throw-overboard launch and float-free
ANIM.liferaft={title:'Liferaft: launching, boarding and float-free',
 steps:[{c:'Check the painter is made fast to a strong point on deck, the area below is clear and the embarkation ladder is ready.',d:6,rule:'SOLAS III Reg 13.4 (stowage and painter)',cam:[[40,-26,27],[28,-14,22]],clip:[0,6]},
        {c:'Release the lashing (slip hook) and roll the canister over the side.',d:5,rule:'',cam:[[46,-48,26],[28,-18,17]],clip:[6,11]},
        {c:'The canister falls into the sea; the painter pays out.',d:4,rule:'LSA Code 4.1.1.3 (drop test from the stowed height)',cam:[[46,-48,26],[28,-18,17]],clip:[11,15]},
        {c:'Pull out the whole painter, then give it a sharp tug: the gas cylinder inflates the raft (in reality 30\u201360 seconds) and the canopy erects itself.',d:7,rule:'LSA Code 4.2.2 (inflation), 4.1.3 (canopy)',cam:[[46,-48,26],[28,-18,17]],clip:[15,22]},
        {c:'Rig the embarkation ladder. Haul the raft alongside under the ladder; board without jumping into the water if possible, then cut the painter with the safety knife and stream the drogue.',d:8,rule:'SOLAS III Reg 11.7 (embarkation ladders); LSA Code 4.1.5',cam:[[46,-48,26],[28,-18,17]],clip:[22,30]},
        {c:'Float-free: if the ship sinks, at a depth of 1.5\u20134 m the hydrostatic release unit frees the canister. It floats up, the painter pulls and inflates the raft, and the weak link breaks so the raft is not dragged down.',d:10,rule:'SOLAS III Reg 13.4; LSA Code 4.1.6',cam:[[46,-40,30],[28,-14,20]],clip:[30,40]},
        {c:'Liferafts and HRUs are serviced at an approved station every 12 months (extendable to 17 months); disposable HRUs are replaced on expiry.',d:6,rule:'SOLAS III Reg 20.8\u201320.9',cam:[[40,-26,27],[28,-14,22]],clip:[40,46]}],
 start(s){ const sd=(s.o&&/_P/.test(s.o.name))?'P':'S'; s.sd=sd; s.sg=sd==='P'?1:-1;
   keepPose(s,['LSA_RaftCan_'+sd+'1','LSA_RaftInflated_'+sd,'LSA_FX_Water_'+sd,'LSA_FX_EmbLadder_'+sd,'LSA_FX_Painter_'+sd]); s.can=nodeOf('LSA_RaftCan_'+sd+'1'); s.spl=fxSplash(s); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip, ct=c[0]+(c[1]-c[0])*k; clipAt(s,'ANIM_liferaft_'+s.sd,ct);
   if(i===2&&s.can) splashAt(s.spl,s.can.getWorldPosition(new THREE.Vector3()),(ct-12.4)/0.8); }};
// ---- man-overboard lifebuoy with light and smoke signal
ANIM.lifebuoy={title:'Man overboard: lifebuoy with light and smoke signal',
 steps:[{c:'Man overboard: shout \u201cMan overboard!\u201d, release the lifebuoy from the bridge wing, press the MOB button on the GNSS/ECDIS, sound three prolonged blasts, hoist flag \u201cO\u201d and inform the master; post a lookout to keep pointing at the person.',d:7,rule:'SOLAS III Reg 7.1.3 (quick release from the bridge); ICS Bridge Procedures Guide',cam:[[40,-34,36],[27,-17,30]],clip:[0,7]},
        {c:'The lifebuoy falls clear of the side (shown at slow speed); the smoke signal and light activate on reaching the water.',d:5,rule:'LSA Code 2.1.2, 2.1.3',cam:[[50,-42,30],[25.5,-21.5,12.5]],clip:[7,9.2]},
        {c:'Orange smoke for at least 15 minutes and a light of at least 2 cd for at least 2 hours mark the position, day and night.',d:9,rule:'LSA Code 2.1.2.1 (light \u2265 2 cd, \u2265 2 h); 2.1.3.1 (smoke \u2265 15 min)',cam:[[50,-42,30],[25.5,-21.5,12.5]],clip:[9.2,18]},
        {c:'Keep the person in sight, manoeuvre to return (e.g. a Williamson turn) and launch the rescue boat to recover them.',d:6,rule:'IAMSAR Manual Vol. III',cam:[[50,-42,30],[25.5,-21.5,12.5]],clip:[18,26.9]}],
 start(s){ const sd=(s.o&&/_P$/.test(s.o.name))?'P':'S'; s.sd=sd; s.sg=sd==='P'?1:-1; keepPose(s,['LSA_BuoyMOB_'+sd]); s.b=nodeOf('LSA_BuoyMOB_'+sd);
   s.smoke=fxSmoke(s,14); s.spl=fxSplash(s); s.lamp=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshBasicMaterial({color:'#fff6a8'})); s.fx.add(s.lamp); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip, ct=c[0]+(c[1]-c[0])*k; clipAt(s,'ANIM_mob_'+s.sd,ct); const p=s.b.getWorldPosition(new THREE.Vector3());
   const wet=ct>9.0; if(i===1) splashAt(s.spl,p,(ct-8.9)/0.6); smokeAt(s.smoke,p,t,wet); s.lamp.visible=wet&&(Math.floor(t*1.5)%2===0); if(wet) s.lamp.position.copy(p).add(new THREE.Vector3(0.5,0.35,0)); }};
// ---- fire hose: rigging at a hydrant, jet and spray (clip ANIM_hose, baked in Blender)
ANIM.hose={title:'Fire hose: rigging, jet and spray',
 steps:[{c:'Fire! Raise the alarm and go to the nearest hydrant station on the catwalk, upwind of the fire. Wear full PPE; a second hose from another hydrant backs you up.',d:5,rule:'SOLAS II-2 Reg 10.2.1.5.1 (two jets from different hydrants)',cam:[[44,-14,27],[56,-6,20.5]],clip:[0,5]},
        {c:'Open the hose box and take out the hose and the dual-purpose nozzle.',d:3,rule:'SOLAS II-2 Reg 10.2.3 (hoses kept at the hydrants)',cam:[[54.8,-4.8,23.6],[52.3,-1.4,22.0]],clip:[5,7]},
        {c:'Couple the hose to the hydrant (65 mm instantaneous coupling) and run it out over the crossover and down the ladder towards the fire, without kinks; then couple the nozzle, shut.',d:10,rule:'SOLAS II-2 Reg 10.2.3.1.1 (25 m hose on ships over 30 m breadth)',cam:[[44,-14,27],[56,-6,20.5]],clip:[7,16.6]},
        {c:'Open the hydrant slowly so the hose fills without a pressure surge.',d:4,rule:'SOLAS II-2 Reg 10.2.1.6 (0.27 N/mm\u00b2 at the hydrants)',cam:[[54.8,-4.8,23.6],[52.3,-1.4,22.0]],clip:[16.6,20]},
        {c:'Open the nozzle on jet: a solid stream for reach, aimed at the base of the fire.',d:5,rule:'SOLAS II-2 Reg 10.2.3.3 (12, 16 or 19 mm nozzles)',cam:[[56,-15,24],[66,-8,20.5]],clip:[20,25]},
        {c:'Switch to spray (water fog) to protect the fire party, cool boundaries and absorb heat. Never use a water jet on an oil fire; use foam.',d:5,rule:'SOLAS II-2 Reg 10.2.3.3 (dual-purpose nozzle)',cam:[[56,-15,24],[66,-8,20.5]],clip:[25,30]},
        {c:'Shut the nozzle, close the hydrant, drain the hose and stow it back in the box, ready for use.',d:6,rule:'',cam:[[44,-14,27],[56,-6,20.5]],clip:[30,37.6]},
        {c:'Checks: every hose box complete each month; hoses inspected each year; fire drills monthly.',d:6,rule:'MSC.1/Circ.1432; SOLAS III Reg 19.3.4',cam:[[44,-14,27],[56,-6,20.5]],clip:[37.6,37.6]}],
 start(s){ keepPose(s,[]); const names=[]; ship.traverse(o=>{ if(/^FFA_(HoseSeg|JetSeg|Nozzle_S52|Spray_S52|HoseBoxDoor_S52|HydrantWheel_S52)/.test(o.name)) names.push(o.name); }); keepPose(s,names); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip; clipAt(s,'ANIM_hose',c[0]+(c[1]-c[0])*k); }};
// ---- engine-room CO2 total flooding (clip ANIM_co2, baked in Blender)
ANIM.co2={title:'Engine-room CO\u2082 release',
 steps:[{c:'A fire in the engine room cannot be put out by other means. The master decides to flood with CO\u2082. Everyone leaves the engine room; take a headcount at the muster point.',d:7,rule:'FSS Code Ch. 5; SOLAS II-2 Reg 10.4',cam:[[1.5,-10,22.5],[8,-6,21.2]],clip:[0,7]},
        {c:'Stop the engine-room ventilation fans and fuel pumps by the remote stops; close the fire dampers, skylights and doors, and the quick-closing fuel valves.',d:7,rule:'SOLAS II-2 Reg 5.2 (closing openings and stopping fans from outside)',cam:[[6,-8,31],[10,-3.1,23.6]],clip:[7,14]},
        {c:'Open the CO\u2082 release cabinet. This sounds the CO\u2082 alarm (siren and flashing light) in the engine room and stops the ventilation.',d:4,rule:'FSS Code Ch. 5, 2.1.3.2',cam:[[4.5,-8.6,21.5],[8,-7,20.6]],clip:[14,18]},
        {c:'The alarm must sound long enough to clear the space, and not less than 20 seconds, before the gas is released. Confirm the headcount once more. (Shown faster.)',d:12,rule:'FSS Code Ch. 5, 2.1.3.2 (pre-discharge alarm \u2265 20 s)',cam:[[4.5,-8.6,21.5],[8,-7,20.6]],clip:[18,38]},
        {c:'Operate control 1 (opens the valve to the engine room), then control 2 (releases the cylinders): two separate controls, in that order.',d:5,rule:'FSS Code Ch. 5, 2.2.2',cam:[[6.0,-7.6,21.0],[8,-7,20.5]],clip:[38,42]},
        {c:'85% of the gas reaches the engine room within 2 minutes. Keep the space closed, cool the boundaries and monitor temperatures. Do not re-enter until the fire is out, the space is ventilated and the atmosphere is tested.',d:10,rule:'FSS Code Ch. 5, 2.2.1',cam:[[1.5,-10,22.5],[8,-6,21.2]],clip:[42,54]},
        {c:'Maintenance: cabinet sealed and alarm tested; inspected by the crew and annually by a competent person, with cylinder contents verified by weighing or level gauge at the intervals in MSC.1/Circ.1318/Rev.1.',d:6,rule:'MSC.1/Circ.1318',cam:[[1.5,-10,22.5],[8,-6,21.2]],clip:[54,62]}],
 start(s){ keepPose(s,['FFA_CO2CabinetDoor','FFA_CO2Valve1','FFA_CO2Valve2','FFA_ERDamper_P','FFA_ERDamper_S']); s.al=nodeOf('FFA_CO2Alarm');
   s.lamp=new THREE.Mesh(new THREE.SphereGeometry(.14,12,10),new THREE.MeshBasicMaterial({color:'#ff8a1a'})); s.fx.add(s.lamp); s.lamp.visible=false; },
 frame(s,t,i,k){ const c=s.A.steps[i].clip, ct=c[0]+(c[1]-c[0])*k; clipAt(s,'ANIM_co2',ct);
   const on=ct>14.5&&ct<54; s.lamp.visible=on&&(Math.floor(t*3)%2===0); if(s.al&&on){ s.lamp.position.copy(B(7.9,-7.0,21.75)); } }};
// ---- pilot transfer by pilot ladder (clip ANIM_pilot, baked in Blender)
ANIM.pilot={title:'Pilot transfer by pilot ladder',
 steps:[{c:'Prepare the boarding point on the lee side as agreed with the pilot station: a responsible officer with a radio, the ladder checked (certificate, steps, ropes, spreaders), and the climb height known.',d:6,rule:'SOLAS V Reg 23.2 (responsible officer; ladder certified and inspected)',cam:[[84,-32,24],[70,-16,16]],clip:[0,6]},
        {c:'Remove the rail bars. Handhold stanchions are in place; the lifebuoy with self-igniting light and a heaving line are ready, and the boarding point is lit.',d:4,rule:'IMO A.1045(27): stanchions 0.70\u20130.80 m apart, \u2265 1.2 m above the rail; lifebuoy, heaving line and lighting',cam:[[73,-19.5,21.5],[70,-15.6,19.6]],clip:[6,10]},
        {c:'Lower the ladder from its reel to the height the pilot has asked for. It lies flat against the ship\u2019s side, within the parallel body and clear of any discharge.',d:8,rule:'SOLAS V Reg 23.3: climb of not less than 1.5 m and not more than 9 m; above 9 m a combination with the accommodation ladder is needed',cam:[[84,-32,24],[70,-16,16]],clip:[10,20]},
        {c:'Secure both side ropes to the strong points on deck \u2014 never to the rails or by shackles.',d:5,rule:'IMO A.1045(27), securing of pilot ladders',cam:[[73,-19.5,21.5],[70,-15.6,19.6]],clip:[20,24.6]},
        {c:'The ship makes a lee; the pilot boat comes up from astern and runs alongside under the ladder at the ship\u2019s speed.',d:8,rule:'IMPA guidance; ship\u2019s speed and lee agreed with the pilot station',cam:[[95,-42,22],[60,-18,13]],clip:[24.6,35]},
        {c:'The pilot steps across at the top of the boat\u2019s rise and climbs with both hands on the side ropes, then comes over the rail between the stanchions and is escorted to the bridge.',d:9,rule:'SOLAS V Reg 23.3.3',cam:[[80,-26,17],[70,-16.5,15]],clip:[35,45]},
        {c:'The pilot boat sheers away. The ladder is recovered to its reel and the rail bars refitted.',d:7,rule:'',cam:[[95,-42,22],[70,-18,13]],clip:[45,55]},
        {c:'Steps: at least 400 mm between ropes, 115 mm wide, 25 mm deep, 310\u2013350 mm apart; spreaders \u2265 1.8 m on the 5th step from the bottom and then every 9 steps or less. Note: amended SOLAS V Reg 23 and new standards (MSC.532(107), MSC.548(107)) apply from 1 January 2028.',d:8,rule:'ISO 799-1; IMO A.1045(27); MSC.532(107)',cam:[[73,-19.5,21.5],[70,-15.6,19.6]],clip:[55,55]}],
 start(s){ keepPose(s,['PT_PilotLadder_S','PT_LadderSecuring_S','PT_RailBars_S','PT_PilotBoat','PT_Pilot']); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip; clipAt(s,'ANIM_pilot',c[0]+(c[1]-c[0])*k); }};
// ---- M9: hose crane and cargo manifold connection (clip ANIM_manifold, baked in Blender)
ANIM.manifold={title:'M9 \u00b7 Hose crane and manifold connection',
 steps:[{c:'Before connecting: ship/shore safety checklist agreed, scupper plugs in, drip tray empty and drain shut, SOPEP gear ready, manifold valve shut and the line drained, pressure gauge reading zero.',d:6,rule:'ISGOTT Ship/Shore Safety Checklist; MARPOL Annex I',cam:[[118,-40,40],[92,-5,20]],clip:[0,6]},
        {c:'The crane driver raises the jib out of its rest and slews over the jetty, guided by a signaller. Meanwhile the blank is removed from the starboard No.3 manifold.',d:7,rule:'Crane SWL and radius marked; limit switches; LOLER-type annual examination',cam:[[118,-40,40],[92,-5,20]],clip:[6,14]},
        {c:'The hook is lowered to the hose; a saddle or bridle is fitted about 2 m from the flange \u2014 never lift by the flange.',d:4,rule:'OCIMF hose handling',cam:[[118,-40,40],[95,-14,17]],clip:[14,16]},
        {c:'The hose is lifted clear of the jetty, keeping its bend radius above the maker\u2019s minimum.',d:7,rule:'Hose certificate: minimum bend radius and working pressure',cam:[[118,-40,40],[95,-12,20]],clip:[16,24]},
        {c:'The crane brings the hose inboard over the rail to the manifold. The crane keeps the hose\u2019s weight off the manifold.',d:7,rule:'OCIMF manifold recommendations: loads on the manifold limited',cam:[[112,-30,30],[96,-14,20]],clip:[24,32]},
        {c:'The flanges are aligned, a new gasket fitted and every bolt hole used; the insulating flange is on the shore side of the hose string.',d:7,rule:'ISGOTT: electrical isolation at the jetty; all bolts fitted',cam:[[99.5,-17.5,22.6],[97,-13.4,21.2]],clip:[32,40]},
        {c:'When ship and terminal agree they are ready, the manifold valve is opened and cargo flows at the agreed starting rate; check for leaks and watch the pressure gauge.',d:6,rule:'ISGOTT: agreed loading plan, start at a slow rate',cam:[[104,-8,25],[97,-12.5,21.3]],clip:[40,46]},
        {c:'Vapour return, if used, connects to the vapour manifold, whose last metre is painted red-yellow-red with the word VAPOUR in black and has a stud at the top of the flange face so a liquid hose cannot be connected to it by mistake. After cargo: drain, close the valve, disconnect, refit the blank.',d:7,rule:'IMO MSC/Circ.585; OCIMF',cam:[[104,-8,25],[99,-12.5,21.3]],clip:[46,52]}],
 start(s){ const names=[]; ship.traverse(o=>{ if(/^(CR_|TRM_)/.test(o.name)) names.push(o.name); }); keepPose(s,names); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip; clipAt(s,'ANIM_manifold',c[0]+(c[1]-c[0])*k); }};
// ---- M7: anchoring on ISF Quest, starboard anchor (clip ANIM_anchor, baked in Blender)
ANIM.anchor={title:'M7 \u00b7 Anchoring: letting go and heaving up',
 steps:[{c:'Anchor party on the forecastle in PPE, with radio to the bridge. Windlass powered and tested, brake on, chain stopper on. Lashings and spurling-pipe cover removed. Depth, holding ground and the length of cable to use known.',d:6,rule:'Company anchoring procedure; ICS Bridge Procedures Guide',cam:[[178,-26,24],[170,-10,22]],clip:[0,6]},
        {c:'Clutch the cable lifter in, take the stopper off and walk the anchor out of the hawse until it hangs clear of the water (a\u2019cockbill).',d:8,rule:'Walk back all the way in water deeper than about 25 m',cam:[[178,-26,24],[172,-14,18]],clip:[6,14]},
        {c:'Brake on, then take the cable lifter out of gear. The anchor now hangs on the brake only.',d:3,rule:'IACS UR A1: windlass brake holds at least 45% of the cable breaking load',cam:[[178,-26,24],[172,-14,18]],clip:[14,16]},
        {c:'Let go: release the brake. The anchor drops and the cable runs out; the brake is used to check it so it does not run away.',d:8,rule:'Real time: about 5 m/s',cam:[[205,-55,8],[185,-15,0]],clip:[16,25]},
        {c:'The ship gathers sternway and the cable is laid out along the bottom rather than piled on the anchor. The officer reports the shackles out and the lead of the cable.',d:9,rule:'Cable in shackles of 27.5 m; typical scope 4\u20136 times the depth',cam:[[210,-70,10],[195,-15,-4]],clip:[25,35]},
        {c:'Brought up: the cable rises and falls back as the anchor takes hold. Brake on, stopper on; show the anchor ball by day and anchor lights by night.',d:5,rule:'COLREG Rule 30 (anchored vessels)',cam:[[210,-70,10],[195,-15,-4]],clip:[35,40]},
        {c:'Heaving up (shown faster): clutch in, stopper off, heave in; report \u201canchor aweigh\u201d and \u201canchor clear of the water\u201d; house the anchor, stopper and lashings on.',d:8,rule:'IACS UR A1: mean hoisting speed at least 9 m/min',cam:[[205,-55,8],[185,-15,0]],clip:[40,50]}],
 start(s){ const names=[]; ship.traverse(o=>{ if(/^ANC2_/.test(o.name)) names.push(o.name); }); keepPose(s,names);
   if(sea&&sea.material){ s.seaM=[sea.material.transparent,sea.material.uniforms?sea.material.uniforms.alpha.value:sea.material.opacity]; sea.material.transparent=true; if(sea.material.uniforms) sea.material.uniforms.alpha.value=0.45; else sea.material.opacity=0.35; sea.material.needsUpdate=true; } },
 end(s){ if(sea&&s.seaM){ sea.material.transparent=s.seaM[0]; if(sea.material.uniforms) sea.material.uniforms.alpha.value=s.seaM[1]; else sea.material.opacity=s.seaM[1]; sea.material.needsUpdate=true; } },
 frame(s,t,i,k){ const c=s.A.steps[i].clip; clipAt(s,'ANIM_anchor',c[0]+(c[1]-c[0])*k); }};
// ---- M8: mooring on ISF Quest, forward spring starboard (clip ANIM_mooring, baked in Blender)
ANIM.mooring={title:'M8 \u00b7 Mooring: running a spring line',
 steps:[{c:'Mooring party briefed, in PPE, with radio to the bridge. Winch tested, brake condition known (annual brake test), lines inspected. Everyone knows where the snap-back zones are \u2014 the whole area round a line under load is dangerous.',d:6,rule:'OCIMF MEG4; COSWP; SOLAS II-1 Reg 3-8',cam:[[160,-34,26],[146,-14,19]],clip:[0,6]},
        {c:'A heaving line is thrown to the linesmen on the berth.',d:6,rule:'',cam:[[150,-40,26],[140,-17,16]],clip:[6,14]},
        {c:'The winch pays out the forward spring through the deck chock while the linesmen pull the eye along the berth.',d:8,rule:'Never stand in a bight or between the line and the chock',cam:[[150,-40,26],[138,-18,16]],clip:[14,25]},
        {c:'The eye is dropped over the bollard.',d:4,rule:'',cam:[[132,-30,19],[126,-21,14.5]],clip:[25,28]},
        {c:'Heave in the slack and tension the line evenly with the other lines of the same group.',d:8,rule:'OCIMF MEG4: lines of the same service of similar length and material',cam:[[160,-34,26],[140,-16,17]],clip:[28,38]},
        {c:'Apply the brake and take the winch out of gear: the line is held on the brake, not on the winch motor.',d:4,rule:'OCIMF MEG4: brake holding capacity about 60% of the line MBL',cam:[[152,-6,23],[148.6,-12.1,20.3]],clip:[38,42]},
        {c:'Tend the moorings as the draught and tide change, so the ship stays tight alongside and the lines share the load.',d:6,rule:'ISGOTT: tending moorings during cargo operations',cam:[[160,-34,26],[140,-16,17]],clip:[42,50]}],
 start(s){ const names=[]; ship.traverse(o=>{ if(/^MOOR_/.test(o.name)) names.push(o.name); }); keepPose(s,names); },
 frame(s,t,i,k){ const c=s.A.steps[i].clip; clipAt(s,'ANIM_mooring',c[0]+(c[1]-c[0])*k); }};
// ---- rudder: SOLAS II-1 Reg 29.3.2 steering test
ANIM.rudder={title:'Steering gear test (35\u00b0 to 30\u00b0 in 28 s)',
 steps:[{c:'Midships. Pre-departure check: both steering pumps available, the rudder angle indicator agrees with the rudder.',d:5,rule:'SOLAS V Reg 26.1 \u2014 steering gear tested within 12 h before departure',cam:[[-24,-26,6],[1,0,4]]},
        {c:'Helm hard to starboard: rudder to 35\u00b0 starboard.',d:5,rule:'SOLAS II-1 Reg 29.3.2',cam:[[-24,-26,6],[1,0,4]]},
        {c:'Hard over from 35\u00b0 starboard to 30\u00b0 port. The limit is 28 s at the deepest draught and full speed; shown here in real time (use the speed button to speed it up).',d:28,rule:'SOLAS II-1 Reg 29.3.2 \u2014 35\u00b0 one side to 30\u00b0 the other in not more than 28 s',cam:[[-24,-26,6],[1,0,4]]},
        {c:'Back to midships. Emergency steering is drilled at least every 3 months.',d:5,rule:'SOLAS V Reg 26.4',cam:[[-24,-26,6],[1,0,4]]}],

function erFocus(){ ['cargo','ballast','coff'].forEach(k=>(layerObjs[k]||[]).forEach(o=>o.visible=false)); }
function tourGo(i){ const st=TOUR[i]; if(!st) return tourEnd(); tourI=i; tourT=performance.now(); 
  const wantCut=!!st.cut, wantUw=!!st.uw; if(cutaway!==wantCut){ setCutaway(wantCut); const b=$('#cut'); if(b) b.setAttribute('aria-pressed',wantCut); } if(underwater!==wantUw){ setUnderwater(wantUw); const b=$('#uw'); if(b) b.setAttribute('aria-pressed',wantUw); }
  camera.near=st.near?0.05:0.1; camera.updateProjectionMatrix(); controls.minDistance=0.2; hotspotEls.forEach(h=>h.el.hidden=true); if(st.cut) erFocus();
  flyTo(B(...st.c),B(...st.g),i===0?2.0:3.2); if(st.sel){ const o=nodeOf(st.sel); if(o) renderCard(o); }
  const box=$('#tour'); box.hidden=false; box.innerHTML=`<div class="prog"><i id="tprog"></i></div><h3>${st.t}</h3><p>${st.d}</p><div class="tbar"><span>Stop ${i+1} of ${TOUR.length}</span><button id="tprev" ${i?'':'disabled'}>Back</button><button id="tpause">${tourPause?'Play':'Pause'}</button><button id="tnext">${i<TOUR.length-1?'Next':'Finish'}</button><button id="texit">Exit tour</button></div>`;
  $('#tprev').onclick=()=>tourGo(Math.max(0,tourI-1)); $('#tnext').onclick=()=>tourGo(tourI+1); $('#texit').onclick=tourEnd;
  $('#tpause').onclick=e=>{ tourPause=!tourPause; e.target.textContent=tourPause?'Play':'Pause'; tourT=performance.now()-(tourPause?0:0); }; }
function tourDur(st){ return 3200+Math.max(7000,st.d.length*62); }
function tourTick(){ if(tourI<0) return; const st=TOUR[tourI]; const e=performance.now()-tourT; const p=$('#tprog'); if(tourPause){ tourT=performance.now()-(Number(p&&p.dataset.e)||0); return; } if(p){ p.style.width=Math.min(100,e/tourDur(st)*100)+'%'; p.dataset.e=e; } if(e>tourDur(st)) tourGo(tourI+1); }
function tourStart(){ if(mode!=='ship') return; stopAnim&&stopAnim(); tourPause=false; tourGo(0); }
function tourEnd(){ tourI=-1; $('#tour').hidden=true; if(cutaway){ setCutaway(false); const b=$('#cut'); if(b) b.setAttribute('aria-pressed',false); } if(underwater){ setUnderwater(false); const b=$('#uw'); if(b) b.setAttribute('aria-pressed',false); } navAction('home'); }

const SEA_T={value:0};
function creatureGeo(st,fins,nr=14){ // st: [[t, ry, rz, yo]] t=0 nose .. 1 tail; body along x (nose at +0.5)
  const P=[],A=[],I=[]; const rings=[];
  for(const [t,ry,rz,yo] of st){ const r=[]; const x=0.5-t;
    if(ry<1e-4&&rz<1e-4){ r.push(P.length/3); P.push(x,yo||0,0); A.push(t); } else for(let k=0;k<nr;k++){ const a=k/nr*Math.PI*2; r.push(P.length/3); P.push(x,(yo||0)+ry*Math.sin(a),rz*Math.cos(a)); A.push(t); }
    rings.push(r); }
  for(let i=0;i<rings.length-1;i++){ const a=rings[i], b=rings[i+1];
    if(a.length===1){ for(let k=0;k<nr;k++) I.push(a[0],b[(k+1)%nr],b[k]); }
    else if(b.length===1){ for(let k=0;k<nr;k++) I.push(a[k],a[(k+1)%nr],b[0]); }
    else for(let k=0;k<nr;k++){ const k2=(k+1)%nr; I.push(a[k],a[k2],b[k2],a[k],b[k2],b[k]); } }
  for(const tri of fins){ for(const p of tri){ P.push(p[0],p[1],p[2]); A.push(0.5-p[0]); } const n=P.length/3; I.push(n-3,n-2,n-1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setAttribute('ax',new THREE.Float32BufferAttribute(A,1)); g.setIndex(I); g.computeVertexNormals(); return g; }
function creatureMat(o){ // o: {back,belly,amp,freq,wave,vertical,pattern}
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:o.rough??0.45,metalness:o.metal??0.25,side:THREE.DoubleSide});
  m.onBeforeCompile=sh=>{ sh.uniforms.uT=SEA_T;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform float uT; varying vec3 vLP; varying float vAx;\n'+(o.inst?'attribute float iPh;':'const float iPh=0.0;'))
     .replace('#include <begin_vertex>',`#include <begin_vertex>
       float ax=clamp(0.5-position.x,0.0,1.0); vLP=position; vAx=ax; float ph=iPh;
       float w=${o.amp.toFixed(3)}*pow(ax,1.6)*sin(ax*${o.wave.toFixed(2)}-uT*${o.freq.toFixed(2)}+ph);
       ${o.vertical?'transformed.y+=w;':'transformed.z+=w;'}`);
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vLP; varying float vAx;')
     .replace('#include <color_fragment>',`#include <color_fragment>
       float sh_=smoothstep(${o.lo??'-0.01'},${o.hi??'0.03'},vLP.y);
       vec3 c=mix(vec3(${o.belly}),vec3(${o.back}),sh_);
       ${o.pattern||''}
       diffuseColor.rgb=c;`); };
  return m; }

          float d=max(0.,-6.0-x);                                    // distance astern of the stern
          // turbulent wake: about one beam wide at the stern, widening as (1+d/L)^0.55, edges meandering and broken
          float m=(4.5*sin(sx*0.009+1.3)+2.2*sin(sx*0.023)+1.0*sin(sx*0.061))*smoothstep(0.,160.,d);
          float hw=11.5*pow(1.0+d/70.0,0.55);

          float cw=abs(y-m)/ed;
          float tex=fbm(vec2(sx,y)*0.22)+0.4*fbm(vec2(sx,y)*0.9+uT*0.5);
          float fade=exp(-d/480.0), fresh=exp(-d/70.0);
          float body=smoothstep(1.0,0.45,cw)*smoothstep(-4.0,6.0,-6.0-x);
          float a=body*(0.38+0.5*fresh)*fade*(0.6+0.5*smoothstep(0.35,0.8,tex));
          a+=smoothstep(0.12,0.0,abs(cw-0.85))*0.25*fade*smoothstep(0.45,0.75,tex)*smoothstep(-4.0,6.0,-6.0-x);            // foam streaks along the edges
          float white=clamp(fresh*1.4,0.,1.);
          // Kelvin arms: crests in a band just inside the 19.47 deg line from the bow and from the stern
          float ka=0.;
          for(int k=0;k<2;k++){ float x0=k==0?176.0:-6.0; float r=x0-x; if(r>0.){ float ay=abs(y), s=ay-0.3536*r; float w=2.2+0.012*r;
              float band=exp(-pow(s/w,2.0))*smoothstep(0.,40.,r)*exp(-r/(k==0?420.0:300.0))*(k==0?smoothstep(150.,230.,r):1.0);
              float ph=(r*0.94-ay*1.55)*0.30+2.0*n(vec2(r*0.02,ay*0.05));            // short, slightly curved en-echelon crests
              float cr=pow(0.5+0.5*sin(ph),3.0)*smoothstep(0.35,0.7,n(vec2(r*0.06+float(k)*9.0,ay*0.12)));   // broken into feathered segments

    const w=new THREE.Mesh(g,m); w.name='WK_FarWake'; w.position.y=11.06; w.renderOrder=4; w.frustumCulled=false; shipGroup.add(w); FOAM.push(w); }
  if(sea&&sea.material.uniforms&&!sea.material.uniforms.flow){ sea.material.uniforms.flow={value:new THREE.Vector2()}; sea.material.fragmentShader=sea.material.fragmentShader.replace('uniform float time;','uniform float time;\nuniform vec2 flow;').replace('getNoise( worldPosition.xz * size )','getNoise( (worldPosition.xz + flow) * size )'); sea.material.needsUpdate=true; } }
// zoom to enter: zooming in close on a part of the ship takes you inside it
let zEnterT=0; const zRay=new THREE.Raycaster();
function toast(msg){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--accent);border-radius:4px;padding:7px 12px;font:500 13px var(--f-body);color:var(--fg);pointer-events:none'; stage.appendChild(t); }

renderer.domElement.addEventListener('wheel',e=>{ if(e.deltaY>=0||mode!=='ship'||!ship||shipAnim||tourI>=0||cutaway) return; const now=performance.now(); if(now-zEnterT<1500) return;
  const r=renderer.domElement.getBoundingClientRect(); zRay.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);

  const p=hit.point, d=hit.distance; if(controls.minDistance<10||d>Math.max(12,controls.minDistance*1.7)) return; const bx=p.x, by=-p.z, bz=p.y; zEnterT=now;
  if(underwater||bz<10.7){ if(!underwater){ setUnderwater(true); const b=$('#uw'); if(b) b.setAttribute('aria-pressed',true); } const n=hit.face?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):new THREE.Vector3(0,0,1); flyTo(p.clone().add(n.multiplyScalar(14)).setY(Math.min(p.y,8)),p,1.4); toast('Underwater: hull below the waterline \u00b7 zoom out to come back outside'); return; }
  if(bx>22&&bx<31.6&&bz>30.6&&bz<35){ $('#brg').onclick(); toast('Inside: navigation bridge \u00b7 zoom out to come back outside'); return; }
  if(bx<32&&bz<19.0){ $('#erb').onclick(); toast('Inside: engine room (see-through hull) \u00b7 zoom out to come back outside'); return; }
  if(bx>40&&bx<158&&bz>18.8){ setCutaway(true); { const c=$('#cut'); if(c) c.setAttribute('aria-pressed',true); } camera.near=0.1; camera.updateProjectionMatrix(); controls.minDistance=1; controls.maxDistance=170;
    const sd=by>=0?1:-1; flyTo(B(Math.min(140,Math.max(58,bx))-22,sd*88,20),B(Math.min(140,Math.max(58,bx)),0,10.5),2.0); toast('Inside: cargo, slop and ballast tanks (see-through hull) \u00b7 zoom out to come back outside'); return; }
},{passive:true});
// zoom out to leave: once inside (bridge, engine room, accommodation, tanks, underwater), zooming out to the limit takes you back
// outside to the hull on the sea
let zExitT=0; const ZLIM={bridge:45,er:80,acc:75,tank:170,uw:150};
function insideNow(){ return mode==='ship'&&!!ship&&(cutaway||underwater||!!accDeck||controls.minDistance<10); }
function exitInside(){ const tg=controls.target.clone(), dir=camera.position.clone().sub(tg); dir.y=Math.max(dir.y,0); if(dir.lengthSq()<1) dir.set(-1,0.6,1); dir.normalize();

renderer.domElement.addEventListener('wheel',e=>{ if(e.deltaY<=0||!insideNow()||shipAnim||tourI>=0) return; const now=performance.now(); if(now-zExitT<900) return;
  const dist=camera.position.distanceTo(controls.target); if(controls.maxDistance>=700){ controls.maxDistance=Math.max(dist*1.3,underwater?ZLIM.uw:accDeck?ZLIM.acc:controls.minDistance<0.4?ZLIM.bridge:cutaway?(controls.minDistance<0.8?ZLIM.er:ZLIM.tank):ZLIM.tank); }
  if(dist>=controls.maxDistance*0.96){ zExitT=now; exitInside(); } },{passive:true});
