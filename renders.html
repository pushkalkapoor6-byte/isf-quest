<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISF Quest Photoreal Views</title>
<style>
:root{--bg:#0d141b;--fg:#e7edf2;--muted:#9aa8b4;--accent:#f0a030;--line:#22303c}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f6f8;--fg:#14202b;--muted:#5b6b78;--accent:#b86a00;--line:#d5dde3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:22px 16px 8px;max-width:1200px;margin:auto}h1{margin:0;font-size:22px;letter-spacing:.02em}
p{color:var(--muted);margin:6px 0 0}a{color:var(--accent)}
main{max-width:1200px;margin:auto;padding:12px 16px 40px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
figure{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
img{display:block;width:100%;height:auto}figcaption{padding:8px 10px;font-size:13px;color:var(--muted);background:var(--bg)}
</style>
</head>
<body>
<header>
<h1>ISF Quest: photoreal views (Unreal Engine 5.8)</h1>
<p>Rendered in Unreal Engine with real-time sky, volumetric clouds, Lumen global illumination, an ocean water body and photo-scanned paint textures. Work in progress towards the VR training ship. <a href="index.html">Back to the interactive walkthrough</a></p>
</header>
<main>
<figure><img src="renders/ue_overview.jpg" alt="ISF Quest at sea, seen from the starboard quarter"><figcaption>At sea, starboard quarter</figcaption></figure>
<figure><img src="renders/ue_ocean.jpg" alt="ISF Quest at sea with ocean waves"><figcaption>Open sea, ocean water body</figcaption></figure>
<figure><img src="renders/ue_deck.jpg" alt="Main deck with pipelines and hose crane"><figcaption>Main deck, manifold area and hose crane</figcaption></figure>
<figure><img src="renders/ue_stern_house.jpg" alt="Accommodation and funnel"><figcaption>Accommodation, funnel and lifeboat</figcaption></figure>
<figure><img src="renders/ue_bow.jpg" alt="Ship seen from ahead"><figcaption>From ahead</figcaption></figure>
<figure><img src="renders/ue_lifeboat.jpg" alt="Free-fall lifeboat on its launching skid at the stern"><figcaption>Free-fall lifeboat, skid and recovery davit (rebuilt C01)</figcaption></figure>
<figure><img src="renders/ue_rescueboat.jpg" alt="Rescue boat on its davit, starboard side"><figcaption>Rescue boat and slewing davit (rebuilt C02)</figcaption></figure>
</main>
</body>
</html>
